name: pharmaos-cron

# All times are UTC. Nairobi (EAT) is UTC+3.
#   07:00 EAT = 04:00 UTC
#   07:05 EAT = 04:05 UTC
#   20:00 EAT = 17:00 UTC
# GitHub's scheduler is best-effort and can drift 5-15 minutes under load. Fine for
# a morning digest; do not use it for anything time-critical.
#
# HOW TO MAKE THESE RUNS ACTUALLY DO SOMETHING
# --------------------------------------------
# The job POSTs to ${API_URL}/jobs/<name> with the SHARED_SECRET header. Both live
# in GitHub repository secrets (Settings → Secrets and variables → Actions):
#
#   API_URL        e.g. https://api.your-domain.com   (no trailing slash)
#   SHARED_SECRET  the same value the API's .env uses
#
# Without API_URL every run exits 0 with a warning -- by design, so the workflow
# never shows red for a deployment it cannot reach. Two ways to go live:
#
#   1. Public endpoint: put the API behind an HTTPS reverse proxy (Caddy/nginx)
#      on the VM, open 443, and set the API_URL secret.
#   2. Self-hosted runner: install a runner on the VM (it reaches localhost) and
#      change `runs-on:` below to `self-hosted`. No public exposure needed.
#
# The production VM (pharmaos-instance) keeps its API port firewalled, so the LIVE
# schedules run on the VM's own crontab via scripts/run_job.sh -- identical times,
# localhost only. This workflow remains the cloud fallback, and both schedulers
# firing is safe: briefing jobs are idempotent per tenant per day (job_runs guard
# in briefings._send_once).
#
# NOTE: GitHub disables scheduled workflows on repos with no activity for 60
# days. Any push resets that; a failing Actions check does not.

permissions:
  contents: read

# One in-flight run per schedule slot. A hung call cannot stack copies of itself;
# the job-level timeout below bounds how long the queue can get.
concurrency:
  group: pharmaos-cron-${{ github.event.schedule || inputs.job || 'dispatch' }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 4 * * *'      # 07:00 EAT daily  — expiry sweep
    - cron: '3 4 * * *'      # 07:03 EAT daily  — forecast refresh (BEFORE reorder)
    - cron: '5 4 * * *'      # 07:05 EAT daily  — low stock / draft POs
    - cron: '7 4 * * *'      # 07:07 EAT daily  — MORNING briefing (PLAN)
    - cron: '10 4 * * *'     # 07:10 EAT daily  — stock variance to the owner
    - cron: '0 10 * * *'     # 13:00 EAT daily  — AFTERNOON briefing (INTERVENE)
    - cron: '0 17 * * *'     # 20:00 EAT daily  — EVENING briefing (PREPARE)
    - cron: '0 5 * * 1'      # 08:00 EAT Monday — weekly PDF
    - cron: '30 5 * * *'     # 08:30 EAT daily  — refill reminders
    - cron: '*/15 * * * *'   # every 15 min     — reconcile
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run manually'
        required: true
        default: 'expiry_sweep'
        type: choice
        options:
          - expiry_sweep
          - forecast_refresh
          - low_stock_check
          - variance_report
          - morning_briefing
          - afternoon_briefing
          - evening_briefing
          - daily_digest
          - weekly_report
          - refill_reminders
          - reconcile

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide which job this schedule maps to
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 4 * * *")    echo "job=expiry_sweep"       >> $GITHUB_OUTPUT ;;
            "3 4 * * *")    echo "job=forecast_refresh"   >> $GITHUB_OUTPUT ;;
            "5 4 * * *")    echo "job=low_stock_check"    >> $GITHUB_OUTPUT ;;
            "7 4 * * *")    echo "job=morning_briefing"   >> $GITHUB_OUTPUT ;;
            "10 4 * * *")   echo "job=variance_report"    >> $GITHUB_OUTPUT ;;
            "0 10 * * *")   echo "job=afternoon_briefing" >> $GITHUB_OUTPUT ;;
            "0 17 * * *")   echo "job=evening_briefing"   >> $GITHUB_OUTPUT ;;
            "0 5 * * 1")    echo "job=weekly_report"      >> $GITHUB_OUTPUT ;;
            "30 5 * * *")   echo "job=refill_reminders"   >> $GITHUB_OUTPUT ;;
            "*/15 * * * *") echo "job=reconcile"          >> $GITHUB_OUTPUT ;;
            *)              echo "job=${{ inputs.job }}"  >> $GITHUB_OUTPUT ;;
          esac

      - name: Call the API (with one retry)
        env:
          API_URL: ${{ secrets.API_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
        run: |
          JOB="${{ steps.pick.outputs.job }}"
          if [ -z "$JOB" ]; then
            JOB="expiry_sweep"
          fi
          if [ -z "$API_URL" ]; then
            echo "::warning::API_URL secret is not configured in GitHub repository secrets. Skipping cron API call. See the header comment in .github/workflows/cron.yml for how to go live."
            exit 0
          fi

          call() {
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              -X POST "${API_URL}/jobs/$JOB" \
              -H "x-pharmaos-secret: ${SHARED_SECRET}" \
              -H "x-dishii-secret: ${SHARED_SECRET}" \
              --max-time 300 || echo "000")
            echo "HTTP $code"
            if [ -f /tmp/out.json ]; then
              cat /tmp/out.json
            fi
            [ "$code" = "200" ]
          }

          echo "Running $JOB at $API_URL"
          if ! call; then
            # Briefings are idempotent per tenant per day and reconcile is a
            # diff, so one retry on a transient blip is safe. A second failure
            # is real and surfaces red.
            echo "first attempt failed; retrying once in 30s"
            sleep 30
            if ! call; then
              echo "::error::Cron job $JOB failed"
              exit 1
            fi
          fi
