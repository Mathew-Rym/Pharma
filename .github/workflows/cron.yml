name: pharmaos-cron

# All times are UTC. Nairobi (EAT) is UTC+3.
#   07:00 EAT = 04:00 UTC
#   07:05 EAT = 04:05 UTC
#   20:00 EAT = 17:00 UTC
# GitHub's scheduler is best-effort and can drift 5-15 minutes under load. Fine for
# a morning digest; do not use it for anything time-critical.

on:
  schedule:
    - cron: '0 4 * * *'      # 07:00 EAT daily  — expiry sweep
    - cron: '3 4 * * *'      # 07:03 EAT daily  — forecast refresh (BEFORE reorder)
    - cron: '5 4 * * *'      # 07:05 EAT daily  — low stock / draft POs
    - cron: '10 4 * * *'     # 07:10 EAT daily  — stock variance to the owner
    - cron: '0 17 * * *'     # 20:00 EAT daily  — evening digest
    - cron: '0 5 * * 1'      # 08:00 EAT Monday — weekly PDF
    - cron: '30 5 * * *'     # 08:30 EAT daily  — refill reminders
    - cron: '*/15 * * * *'   # every 15 min     — reconcile
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run manually'
        required: true
        default: 'expiry_sweep'
        type: choice
        options:
          - expiry_sweep
          - forecast_refresh
          - low_stock_check
          - variance_report
          - daily_digest
          - weekly_report
          - refill_reminders
          - reconcile

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Decide which job this schedule maps to
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 4 * * *")    echo "job=expiry_sweep"     >> $GITHUB_OUTPUT ;;
            "3 4 * * *")    echo "job=forecast_refresh" >> $GITHUB_OUTPUT ;;
            "5 4 * * *")    echo "job=low_stock_check"  >> $GITHUB_OUTPUT ;;
            "10 4 * * *")   echo "job=variance_report"  >> $GITHUB_OUTPUT ;;
            "0 17 * * *")   echo "job=daily_digest"     >> $GITHUB_OUTPUT ;;
            "0 5 * * 1")    echo "job=weekly_report"    >> $GITHUB_OUTPUT ;;
            "30 5 * * *")   echo "job=refill_reminders" >> $GITHUB_OUTPUT ;;
            "*/15 * * * *") echo "job=reconcile"        >> $GITHUB_OUTPUT ;;
            *)              echo "job=${{ inputs.job }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Call the API
        run: |
          JOB="${{ steps.pick.outputs.job }}"
          if [ -z "$JOB" ]; then
            JOB="expiry_sweep"
          fi
          API_URL="${{ secrets.API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::warning::API_URL secret is not configured in GitHub repository secrets. Skipping cron API call."
            exit 0
          fi
          echo "Running $JOB at $API_URL"
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "${API_URL}/jobs/$JOB" \
            -H "x-pharmaos-secret: ${{ secrets.SHARED_SECRET }}" \
            --max-time 300 || echo "000")
          echo "HTTP $code"
          if [ -f /tmp/out.json ]; then
            cat /tmp/out.json
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Cron job $JOB failed with HTTP $code"
            exit 1
          fi
