name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements.txt -r dashboard/requirements.txt
      # DB tests self-skip when DATABASE_URL is absent, so this runs the pure ones
      - run: pytest tests/ -v
